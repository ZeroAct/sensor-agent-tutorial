[project]
name = "dummy-plant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.9.0,<3",
]

[project.scripts]
plant = "start_plant:main"
plant-mcp = "start_plant_mcp:main"
claude-config = "start_claude_config:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["start_plant", "start_plant_mcp", "start_claude_config"]
