<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학습용 냉각 플랜트 · Dummy Cooling Plant</title>
  <style>
    :root {
      --bg: #0b1220;
      --floor: #121c2f;
      --card: #17233a;
      --line: #2a3c5c;
      --cyan: #5eead4;
      --muted: #8aa0c2;
      --white: #eef4ff;
      --normal: #34d399;
      --warning: #fbbf24;
      --anomaly: #fb7185;
      --idle: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--white); font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header, footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    footer { border-bottom: 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 6px 16px; }
    h1 { margin: 0; font-size: 15px; letter-spacing: 0.04em; }
    .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .pills { display: flex; gap: 6px; flex-wrap: nowrap; }
    .pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 9px; font-size: 11px; white-space: nowrap; }
    .ok { color: var(--normal); }
    .bad { color: var(--anomaly); }
    .warn { color: var(--warning); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; overflow: hidden; }
    .map-wrap { padding: 8px; min-height: 0; }
    svg {
      width: 100%; height: 100%;
      background:
        linear-gradient(90deg, rgba(94,234,212,0.04) 1px, transparent 1px),
        linear-gradient(rgba(94,234,212,0.04) 1px, transparent 1px),
        var(--floor);
      background-size: 28px 28px, 28px 28px, auto;
      border: 1px solid var(--line); border-radius: 12px;
    }
    .zone { fill: rgba(23, 35, 58, 0.55); stroke: #60a5fa; stroke-dasharray: 1.2 1.1; stroke-width: 0.35; }
    .zone-label { fill: #93c5fd; font-size: 2.1px; letter-spacing: 0.08px; font-weight: 700; }
    .eq-label { fill: #cbd5e1; font-size: 1.45px; }
    .sid { fill: var(--white); font-size: 1.45px; font-weight: 700; }
    .sval { fill: var(--cyan); font-size: 1.35px; }
    aside {
      border-left: 1px solid var(--line); background: #0e1728;
      min-height: 0; overflow: hidden; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    h2 { margin: 0; font-size: 10px; letter-spacing: 0.12em; color: var(--muted); flex-shrink: 0; }
    .queue { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
    .queue-card {
      border: 1px solid var(--warning); background: #2a2210; border-radius: 8px;
      padding: 6px 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
    }
    .queue-card b { font-size: 12px; }
    .queue-card .meta { color: var(--muted); font-size: 10px; }
    .list {
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; gap: 4px;
    }
    .row {
      border: 1px solid var(--line); background: var(--card); border-radius: 8px;
      padding: 5px 8px; margin: 0; flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 3px;
    }
    .row.pending { border-color: var(--warning); }
    .row.failed { border-color: var(--anomaly); }
    .row.selected { border-color: var(--cyan); }
    .row { cursor: pointer; }
    .row-top { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .row-top b { font-size: 12px; flex: 0 0 auto; }
    .row-top .meta { color: var(--muted); font-size: 10px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sensors { display: flex; gap: 8px; flex: 0 0 auto; min-height: 14px; }
    .sensor-chip {
      flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; gap: 5px;
      font-size: 10px; color: var(--muted);
    }
    .sensor-chip .sid { font-size: 11px; font-weight: 700; color: var(--white); }
    .sensor-chip .rms { font-variant-numeric: tabular-nums; color: var(--cyan); font-size: 12px; }
    .status { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; flex: 0 0 auto; }
    .status.normal, .status.on, .status.ok { color: var(--normal); }
    .status.warning, .status.off { color: var(--warning); }
    .status.anomaly, .status.failed { color: var(--anomaly); }
    .status.idle, .status.offline { color: var(--idle); }
    .pwr { display: flex; gap: 4px; flex: 0 0 auto; }
    .pwr button {
      border: 1px solid var(--line); background: #0f1a2c; color: var(--white);
      border-radius: 6px; padding: 3px 8px; font-size: 10px; cursor: pointer; line-height: 1.2;
    }
    .pwr button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .pwr button.fix { border-color: #8a6a1a; color: var(--warning); }
    .pwr button.fix:hover:not(:disabled) { border-color: var(--warning); }
    .pwr button.accept { background: #3a2e0c; border-color: var(--warning); color: var(--warning); }
    .pwr button.reset { border-color: var(--anomaly); color: var(--anomaly); }
    .pwr button:disabled { opacity: 0.35; cursor: not-allowed; }
    .reason { color: var(--warning); font-size: 10px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
    .sid-map { fill: var(--white); font-size: 1.35px; font-weight: 700; }
    .log-pane {
      flex: 0 0 120px; min-height: 0; overflow: hidden;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
      display: flex; flex-direction: column; gap: 4px; background: #101a2c;
    }
    .log-pane h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .log-pane h2 span { color: var(--cyan); letter-spacing: 0; font-size: 11px; text-transform: none; }
    .log-lines {
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; gap: 2px;
    }
    .log-line {
      display: grid; grid-template-columns: 36px 52px minmax(0, 1fr);
      gap: 6px; font-size: 11px; line-height: 1.25;
      white-space: nowrap;
    }
    .log-line .t { color: var(--muted); font-variant-numeric: tabular-nums; }
    .log-line .k { text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
    .log-line .m { overflow: hidden; text-overflow: ellipsis; color: var(--white); }
    .log-line.anomaly .k, .log-line.fail .k { color: var(--anomaly); }
    .log-line.power .k, .log-line.fix_request .k { color: var(--warning); }
    .log-line.fix .k, .log-line.replace .k { color: var(--cyan); }
    .log-empty { color: var(--muted); font-size: 11px; }
    .equipment { cursor: pointer; }
    .equipment.selected rect, .equipment.selected circle, .equipment.selected polygon {
      stroke-width: 0.55;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
    .sensor.anomaly .halo { animation: pulse 1.1s ease-in-out infinite; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>DUMMY COOLING PLANT · TOP-DOWN</h1>
      <div class="sub">설비+센서 한 카드 · FIX는 작업자 수락 · 이상 3회 트립</div>
    </div>
    <div class="pills">
      <div class="pill" id="link">SSE 연결 중…</div>
      <div class="pill" id="anom">anomaly 0</div>
      <div class="pill" id="fail">failed 0</div>
      <div class="pill" id="fixq">fix 0</div>
      <div class="pill" id="scount">센서 10</div>
      <div class="pwr"><button class="reset" id="reset-db" type="button">DB 초기화</button></div>
    </div>
  </header>
  <main>
    <div class="map-wrap">
      <svg id="floor" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="공장 평면도"></svg>
    </div>
    <aside>
      <h2 id="queue-head" hidden>FIX 요청</h2>
      <div class="queue" id="queue"></div>
      <h2>진동 센서 10 · 부모 설비</h2>
      <div class="list" id="list"></div>
      <div class="log-pane">
        <h2>설비 로그 <span id="log-asset">선택</span></h2>
        <div class="log-lines" id="loglines"></div>
      </div>
    </aside>
  </main>
  <footer>
    <span>에이전트는 request_fix만. 공구는 화면의 FIX / 수락.</span>
    <span>Open WebUI MCP <code>/mcp</code></span>
  </footer>
  <script>
    const svg = document.getElementById("floor");
    const list = document.getElementById("list");
    const queue = document.getElementById("queue");
    const queueHead = document.getElementById("queue-head");
    const loglines = document.getElementById("loglines");
    const logAsset = document.getElementById("log-asset");
    const NS = "http://www.w3.org/2000/svg";
    let selectedId = "pump-a";
    let latest = null;

    function el(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
      if (text) node.textContent = text;
      return node;
    }
    function shortSensor(id, assetId) {
      if (id === assetId) return "vib";
      if (id.startsWith(assetId + "-")) return id.slice(assetId.length + 1);
      return id;
    }
    function sensorColor(status) {
      if (status === "anomaly" || status === "failed") return "#fb7185";
      if (status === "warning") return "#fbbf24";
      if (status === "normal") return "#34d399";
      return "#64748b";
    }
    function assetStroke(asset) {
      if (asset.health === "failed") return "#fb7185";
      if (asset.pending_fix) return "#fbbf24";
      if (asset.power !== "on") return "#64748b";
      return "#7dd3fc";
    }
    async function post(path, body) {
      await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }
    function setPower(assetId, on) { return post("/demo/power", { asset_id: assetId, on }); }
    function applyFix(assetId) { return post("/demo/fix", { action: "apply", asset_id: assetId }); }
    function acceptFix(requestId) { return post("/demo/fix", { action: "accept", request_id: requestId }); }
    function dismissFix(requestId) { return post("/demo/fix", { action: "dismiss", request_id: requestId }); }
    function selectAsset(assetId) {
      selectedId = assetId;
      if (latest) render(latest);
    }
    function clock(ts) {
      if (!ts) return "--:--";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return String(ts).slice(11, 16) || "--:--";
      return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    }
    function eventCopy(ev) {
      const d = ev.detail || {};
      const kinds = {
        anomaly: "이상",
        fail: "고장",
        power: "전원",
        fix: "FIX",
        fix_request: "요청",
        replace: "교체",
      };
      const k = kinds[ev.kind] || ev.kind;
      let msg = "";
      if (ev.kind === "anomaly") {
        const short = (ev.sensor_id || "").replace(/^[a-z0-9]+-[a-z0-9]+-/, "") || ev.sensor_id || "";
        msg = `${short} ${d.rms_mm_s ?? "—"} · ${d.count || "?"}/${d.trip_limit || 3}`;
      } else if (ev.kind === "fail") {
        msg = d.reason || "트립";
      } else if (ev.kind === "power") {
        msg = d.power === "on" ? "ON" : (d.reason || "OFF");
      } else if (ev.kind === "fix") {
        msg = d.was_failed ? "복구 · 시리얼 유지" : "예방 · 카운트 리셋";
      } else if (ev.kind === "fix_request") {
        if (d.status === "dismissed") msg = "거절";
        else msg = d.note || "작업자 요청";
      } else if (ev.kind === "replace") {
        msg = `${d.old_serial || "?"} → ${d.new_serial || "?"}`;
      } else {
        msg = JSON.stringify(d);
      }
      return { k, msg };
    }
    function renderLog(asset) {
      loglines.replaceChildren();
      if (!asset) {
        logAsset.textContent = "선택";
        const empty = document.createElement("div");
        empty.className = "log-empty";
        empty.textContent = "설비를 고르면 이 자리의 로그만 보입니다.";
        loglines.appendChild(empty);
        return;
      }
      logAsset.textContent = asset.asset_id;
      const events = (asset.events || []).slice(0, 6);
      if (!events.length) {
        const empty = document.createElement("div");
        empty.className = "log-empty";
        empty.textContent = "아직 이벤트가 없습니다.";
        loglines.appendChild(empty);
        return;
      }
      events.forEach((ev) => {
        const line = document.createElement("div");
        line.className = `log-line ${ev.kind || ""}`;
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = clock(ev.ts);
        const k = document.createElement("span");
        k.className = "k";
        const copy = eventCopy(ev);
        k.textContent = copy.k;
        const m = document.createElement("span");
        m.className = "m";
        m.textContent = copy.msg;
        line.append(t, k, m);
        loglines.appendChild(line);
      });
    }
    function applyFix(assetId) { return post("/demo/fix", { action: "apply", asset_id: assetId }); }
    function acceptFix(requestId) { return post("/demo/fix", { action: "accept", request_id: requestId }); }
    function dismissFix(requestId) { return post("/demo/fix", { action: "dismiss", request_id: requestId }); }

    function drawAsset(item) {
      const g = el("g", { class: "equipment" + (item.asset_id === selectedId ? " selected" : ""), "data-asset-id": item.asset_id });
      const x = item.x, y = item.y, w = item.w, h = item.h;
      const stroke = assetStroke(item);
      const fill = item.health === "failed" ? "#3f1d24" : (item.pending_fix ? "#3a3218" : "#22324c");
      const common = { fill, stroke, "stroke-width": 0.32 };
      if (item.kind === "conveyor") {
        g.appendChild(el("rect", { ...common, x, y, width: w, height: h, rx: 0.6 }));
      } else if (item.kind === "tower") {
        g.appendChild(el("polygon", {
          ...common,
          points: `${x+0.8},${y+h} ${x+w-0.8},${y+h} ${x+w-1.6},${y} ${x+1.6},${y}`
        }));
      } else if (item.kind === "fan" || item.kind === "mixer") {
        g.appendChild(el("circle", { ...common, cx: x + w / 2, cy: y + h / 2, r: Math.min(w, h) / 2.2 }));
      } else if (item.kind === "pump") {
        g.appendChild(el("rect", { ...common, x, y: y + 2, width: w * 0.55, height: h - 4, rx: 0.5 }));
        g.appendChild(el("circle", { ...common, cx: x + w * 0.78, cy: y + h / 2, r: h / 3.4 }));
      } else {
        g.appendChild(el("rect", { ...common, x, y, width: w, height: h, rx: 0.5 }));
      }
      const state = item.health === "failed" ? "FAILED" : (item.pending_fix ? "FIX?" : (item.power === "on" ? "ON" : "OFF"));
      g.appendChild(el("text", { class: "eq-label", x: x + 0.4, y: y - 0.6 }, `${item.label} · ${state}`));
      if (item.asset_id === selectedId) {
        g.setAttribute("stroke-opacity", "1");
      }
      g.addEventListener("click", (ev) => {
        ev.stopPropagation();
        selectAsset(item.asset_id);
      });
      return g;
    }

    function render(data) {
      latest = data;
      svg.replaceChildren();
      (data.zones || []).forEach((zone) => {
        svg.appendChild(el("rect", { class: "zone", x: zone.x, y: zone.y, width: zone.w, height: zone.h, rx: 0.8 }));
        svg.appendChild(el("text", { class: "zone-label", x: zone.x + 1, y: zone.y + 3.2 }, (zone.name_ko || zone.name).toUpperCase()));
      });
      (data.assets || []).forEach((item) => svg.appendChild(drawAsset(item)));
      (data.sensors || []).forEach((sensor) => {
        const status = sensor.last_status || "idle";
        const g = el("g", { class: `sensor ${status}` });
        const fill = sensorColor(status);
        g.appendChild(el("circle", { class: "halo", cx: sensor.x, cy: sensor.y, r: 2.3, fill, opacity: 0.28 }));
        g.appendChild(el("circle", { class: "core", cx: sensor.x, cy: sensor.y, r: 1.05, fill, stroke: "#07101d", "stroke-width": 0.25 }));
        const short = shortSensor(sensor.sensor_id, sensor.asset_id);
        const labelLeft = sensor.x >= 70 || String(sensor.sensor_id).endsWith("-nde");
        const tx = labelLeft ? sensor.x - 1.7 : sensor.x + 1.7;
        const anchor = labelLeft ? "end" : "start";
        g.appendChild(el("text", { class: "sid-map", x: tx, y: sensor.y - 0.35, "text-anchor": anchor }, short));
        const rms = sensor.last_rms_mm_s == null ? "—" : Number(sensor.last_rms_mm_s).toFixed(2);
        g.appendChild(el("text", { class: "sval", x: tx, y: sensor.y + 1.5, "text-anchor": anchor }, `${rms}`));
        svg.appendChild(g);
      });

      const pending = data.fix_requests || [];
      queue.replaceChildren();
      queueHead.hidden = pending.length === 0;
      pending.forEach((req) => {
        const card = document.createElement("div");
        card.className = "queue-card";
        const left = document.createElement("div");
        const b = document.createElement("b");
        b.textContent = req.asset_id;
        const meta = document.createElement("div");
        meta.className = "meta";
        const n = req.anomaly_total || 0;
        const trip = req.trip_anomaly_count || 3;
        meta.textContent = `${req.note || "작업자 FIX 요청"} · 이상 ${n}/${trip}`;
        left.append(b, meta);
        const btns = document.createElement("div");
        btns.className = "pwr";
        const acc = document.createElement("button");
        acc.className = "accept";
        acc.textContent = "수락";
        acc.addEventListener("click", () => acceptFix(req.request_id));
        const dis = document.createElement("button");
        dis.textContent = "거절";
        dis.addEventListener("click", () => dismissFix(req.request_id));
        btns.append(acc, dis);
        card.append(left, btns);
        queue.appendChild(card);
      });

      list.replaceChildren();
      const sensors = data.sensors || [];
      sensors.forEach((sensor) => {
        const asset = (data.assets || []).find((a) => a.asset_id === sensor.asset_id) || {
          asset_id: sensor.asset_id,
          serial: "",
          health: sensor.asset_health,
          power: sensor.asset_power,
          anomaly_total: 0,
          trip_anomaly_count: 3,
          pending_fix: null,
          last_reason: null,
        };
        const row = document.createElement("div");
        row.className = "row"
          + (asset.health === "failed" || sensor.last_status === "failed" ? " failed" : "")
          + (asset.pending_fix ? " pending" : "")
          + (asset.asset_id === selectedId ? " selected" : "");
        row.addEventListener("click", (ev) => {
          if (ev.target.closest("button")) return;
          selectAsset(asset.asset_id);
        });
        const top = document.createElement("div");
        top.className = "row-top";
        const b = document.createElement("b");
        b.textContent = sensor.sensor_id;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${asset.asset_id} · ${asset.serial || ""}`.trim();
        const st = document.createElement("div");
        const health = asset.health === "failed" ? "failed" : (sensor.last_status || asset.power || "idle");
        st.className = `status ${health}`;
        st.textContent = health;
        const pwr = document.createElement("div");
        pwr.className = "pwr";
        const onBtn = document.createElement("button");
        onBtn.textContent = "ON";
        onBtn.disabled = asset.health === "failed" || asset.power === "on";
        onBtn.addEventListener("click", () => setPower(asset.asset_id, true));
        const offBtn = document.createElement("button");
        offBtn.textContent = "OFF";
        offBtn.disabled = asset.health === "failed" || asset.power !== "on";
        offBtn.addEventListener("click", () => setPower(asset.asset_id, false));
        const fixBtn = document.createElement("button");
        fixBtn.className = "fix";
        fixBtn.textContent = "FIX";
        fixBtn.addEventListener("click", () => applyFix(asset.asset_id));
        pwr.append(onBtn, offBtn, fixBtn);
        top.append(b, meta, st, pwr);
        row.appendChild(top);

        const chips = document.createElement("div");
        chips.className = "sensors";
        const chip = document.createElement("div");
        chip.className = "sensor-chip";
        const rms = document.createElement("span");
        rms.className = "rms";
        rms.textContent = sensor.last_rms_mm_s == null ? "—" : Number(sensor.last_rms_mm_s).toFixed(2);
        const ss = document.createElement("span");
        const status = sensor.last_status || "idle";
        ss.className = `status ${status}`;
        ss.textContent = `${status} ${sensor.anomaly_count || 0}/${sensor.trip_anomaly_count || 3}`;
        chip.append(rms, ss);
        chips.appendChild(chip);
        row.appendChild(chips);
        list.appendChild(row);
      });
      const selected = (data.assets || []).find((a) => a.asset_id === selectedId);
      renderLog(selected);

      const total = data.anomaly_count || 0;
      const live = data.live_anomaly_count || 0;
      const anom = document.getElementById("anom");
      anom.textContent = `anomaly ${total} · live ${live}`;
      anom.className = "pill " + ((live || total) ? "bad" : "ok");
      document.getElementById("fail").textContent = `failed ${data.failed_count || 0}`;
      document.getElementById("fail").className = "pill " + ((data.failed_count || 0) ? "bad" : "ok");
      const nFix = data.pending_fix_count || 0;
      const fixq = document.getElementById("fixq");
      fixq.textContent = `fix ${nFix}`;
      fixq.className = "pill " + (nFix ? "warn" : "ok");
      const nSens = data.sensor_count || (data.sensors || []).length;
      document.getElementById("scount").textContent = `센서 ${nSens}`;
    }

    async function boot() {
      const res = await fetch("/demo/factory");
      render(await res.json());
      const src = new EventSource("/factory/events");
      const link = document.getElementById("link");
      src.onopen = () => { link.textContent = "SSE live"; link.className = "pill ok"; };
      src.onerror = () => { link.textContent = "SSE 재연결"; link.className = "pill bad"; };
      src.onmessage = (ev) => render(JSON.parse(ev.data));
      document.getElementById("reset-db").addEventListener("click", async () => {
        if (!window.confirm("SQLite를 전부 지우고 설비를 다시 켭니다. 로그·이상 횟수도 사라집니다.")) return;
        await post("/demo/reset", {});
      });
    }
    boot();
  </script>
</body>
</html>
